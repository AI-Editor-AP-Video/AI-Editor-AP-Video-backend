name: ap-editorial-backend

services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/ai-editor-ap-video/ai-editor-ap-video-backend:latest}
    container_name: ap_editorial_backend
    restart: unless-stopped
    ports:
      # Cloudflare Edge terminates SSL and forwards traffic to EC2 on HTTP port 80
      - "80:4000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=4000
      - NODE_OPTIONS=--max-old-space-size=1536
    volumes:
      - uploads_data:/app/uploads
    # Memory safety guards to prevent Linux kernel OOM kills
    deploy:
      resources:
        limits:
          memory: 1800M
        reservations:
          memory: 512M
    # Strict Docker log rotation (max 60MB total across 3 files)
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  uploads_data:
